name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs every 12 hours
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Malika200020
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#fe428e&color_dots=#ebedf0,#fcc5d9,#fd93b8,#fe6a9f,#fe428e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f8d847&color_dots=#1f1d33,#5c1f45,#9a2c62,#d4387c,#fe428e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
